// RGB565 -> RGB
function rgb565_to_rgb(c) {
  const r = (c >> 11) & 0x1F;
  const g = (c >> 5) & 0x3F;
  const b = c & 0x1F;
  return [r / 31, g / 63, b / 31];
}

// Ground grid

buildCar(data).catch(err => {
  document.getElementById('info').innerHTML += `<br><b style="color:red">加载失败: ${err}</b>`;
});

async function buildCar(data) {
    const geometry = new THREE.BufferGeometry();
    const verts = data.vertices;
    const positions = [];
    const colors = [];

    for (const [indices, colorName] of data.faces) {
      const colorVal = CAR_COLORS[colorName] || 0xFFFF;
      const [r, g, b] = rgb565_to_rgb(colorVal);
      // Triangulate the polygon (fan)
      for (let i = 1; i < indices.length - 1; i++) {
        for (const vi of [indices[0], indices[i], indices[i + 1]]) {
          const v = verts[vi];
          positions.push(v[0], v[1], v[2]);
          colors.push(r, g, b);
        }
      }
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      vertexColors: true,
      side: THREE.DoubleSide,
      flatShading: true,
    });

    const car = new THREE.Mesh(geometry, material);
    car.rotation.y = Math.PI;  // face camera
    scene.add(car);

    // Wireframe overlay
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
    line.rotation.y = Math.PI;
    scene.add(line);

    console.log(`Loaded ${verts.length} vertices, ${data.faces.length} faces`);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
